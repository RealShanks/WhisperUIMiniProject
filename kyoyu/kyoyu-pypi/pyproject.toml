[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyoyu"
version = "0.1.0"
description = "kyoyu, distributed as a prebuilt binary"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
kyoyu = "kyoyu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyoyu = ["bin/*"]
